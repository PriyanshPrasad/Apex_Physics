<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title>Apex Physics quantum brain logo</title>
  <desc>A stylized person silhouette with a glowing brain formed by atomic orbits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7668e8"/>
      <stop offset="1" stop-color="#4b83d4"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd77a"/>
      <stop offset="1" stop-color="#ff9ec0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="49" fill="#171a42" opacity=".24"/>
  <circle cx="64" cy="37" r="15" fill="#f5f7ff"/>
  <path d="M28 105c2-22 16-35 36-35s34 13 36 35" fill="#f5f7ff"/>
  <path d="M43 41c-4-16 6-27 21-27s25 11 21 27c-2 8-8 13-21 13S45 49 43 41Z" fill="url(#brain)" filter="url(#glow)"/>
  <path d="M64 16v34M48 29c6 2 9 6 8 12m24-12c-6 2-9 6-8 12M56 20c2 5 1 9-3 13m19-13c-2 5-1 9 3 13M64 27c-4 4-4 9 0 13" fill="none" stroke="#fff7df" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
  <g fill="none" stroke="#d6e5ff" stroke-width="1.5" opacity=".85">
    <ellipse cx="64" cy="35" rx="37" ry="12" transform="rotate(25 64 35)"/>
    <ellipse cx="64" cy="35" rx="37" ry="12" transform="rotate(-25 64 35)"/>
    <ellipse cx="64" cy="35" rx="37" ry="12" transform="rotate(90 64 35)"/>
  </g>
  <g fill="#fff4ad" filter="url(#glow)"><circle cx="96" cy="50" r="3"/><circle cx="35" cy="49" r="2.5"/><circle cx="64" cy="4" r="2.5"/></g>
